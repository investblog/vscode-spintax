name: Publish

# Publishes to the VS Code Marketplace and attaches the .vsix to a GitHub Release.
#
# Normal path: push a version tag (`git tag 1.2.0 && git push --follow-tags`).
# The tag is the trigger, so the Release and the Marketplace build cannot drift
# apart. workflow_dispatch stays as a manual fallback for re-running after a
# transient Marketplace failure.
#
# Secrets are OPTIONAL. With none set, this still builds the .vsix and attaches
# it to a GitHub Release; only the Marketplace upload is skipped.
#
#   VSCE_PAT  — Azure DevOps PAT, scope Marketplace > Manage, Organization =
#               "All accessible organizations". Note before investing in this:
#               creating a PAT needs an Azure DevOps organization, creating an
#               organization now needs a non-trial Azure subscription, and the
#               "all organizations" (global) PAT this requires is retired on
#               2026-12-01. Microsoft's replacement is Entra ID workload identity
#               federation, documented for Azure Pipelines rather than Actions.
#   OVSX_PAT  — Open VSX token. Skipped when absent.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

      # The tag is what a reader traces back to a commit; package.json is what
      # the Marketplace records. If they disagree, publishing still succeeds and
      # ships a build whose provenance is a guess — so fail loudly instead.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_ENV"

      - name: Resolve version for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Package once, then publish that exact file and attach the same bytes to
      # the Release. Letting `vsce publish` repack would allow the Marketplace
      # build and the downloadable .vsix to differ.
      - name: Package
        run: npx vsce package --out "spintax-${{ env.version }}.vsix"

      # Skipped, not failed, when the secret is absent: the Release below is the
      # part that works with no credentials at all, and it is worth having on its
      # own. See the PAT note in the header for why this secret may never be set.
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "spintax-${{ env.version }}.vsix"

      - name: Marketplace publish skipped
        if: env.VSCE_PAT == ''
        run: |
          echo "::notice::VSCE_PAT is not set — the .vsix was built and attached to the Release, but nothing was published to the Marketplace. Upload it manually at https://marketplace.visualstudio.com/manage/publishers/301st"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        # --yes: ovsx is not a dependency, and npx would otherwise prompt.
        run: npx --yes ovsx publish "spintax-${{ env.version }}.vsix" -p "$OVSX_PAT"

      - name: Create GitHub Release with the .vsix
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.version }}" \
            "spintax-${{ env.version }}.vsix" \
            --title "${{ env.version }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
